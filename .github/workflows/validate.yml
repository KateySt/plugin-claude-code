name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate marketplace and plugins
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            npx -y @anthropic-ai/claude-code plugin validate --strict "$dir"
          done
      - name: Forbid local paths in plugins
        run: |
          if grep -rnE 'C:\\|/Users/|/home/|DevDigest' plugins/; then
            echo "::error::Local paths or DevDigest references found in plugins/"; exit 1
          fi

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PAGES_BASE_PATH: /plugin-claude-code
      - run: npm run postbuild:check

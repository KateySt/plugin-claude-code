name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate marketplace and plugins
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .
      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            npx -y @anthropic-ai/claude-code plugin validate --strict "$dir"
          done

name: Release plugin

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory name under plugins/"
        required: true
        default: agent-harness
      version:
        description: "New version, semver without 'v' (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check inputs
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$PLUGIN" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || { echo "::error::Invalid plugin name: $PLUGIN"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Version must be semver like 1.2.3: $VERSION"; exit 1; }
          [ -f "plugins/$PLUGIN/.claude-plugin/plugin.json" ] || { echo "::error::plugins/$PLUGIN not found"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$PLUGIN--v$VERSION" >/dev/null; then
            echo "::error::Tag $PLUGIN--v$VERSION already exists"; exit 1
          fi
          CURRENT=$(node -p "require('./plugins/$PLUGIN/.claude-plugin/plugin.json').version || ''")
          [ "$CURRENT" != "$VERSION" ] || { echo "::error::plugin.json is already at $VERSION"; exit 1; }
          echo "Releasing $PLUGIN: $CURRENT -> $VERSION"

      - name: Bump version in plugin.json
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = `plugins/${process.env.PLUGIN}/.claude-plugin/plugin.json`;
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Validate
        run: npx -y @anthropic-ai/claude-code plugin validate --strict .

      - name: Commit, tag, push
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: $PLUGIN v$VERSION"
          git push origin main
          npx -y @anthropic-ai/claude-code plugin tag "plugins/$PLUGIN" --push

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$PLUGIN--v$VERSION" \
            --title "$PLUGIN v$VERSION" \
            --generate-notes \
            --verify-tag
